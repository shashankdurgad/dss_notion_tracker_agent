[project]
name = "dss-notion-tracker-agent"
version = "0.1.0"
description = "Chatbot agent over UCL Data Science Society's Notion workspace, via Notion MCP + Gemini"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.0.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=43.0.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Vercel ---
# Vercel detects FastAPI from the dependencies above and builds the app at
# `entrypoint` into a single Vercel Function.
#
# The frontend build must be declared HERE rather than as `buildCommand` in
# vercel.json: a buildCommand there takes precedence over the Python build
# entirely, so the function is never packaged and every API route 404s.
# As a script, it runs after dependencies are installed and before deploy,
# producing frontend/dist for the StaticFiles mount in backend/main.py.
[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "cd frontend && npm install && npm run build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
